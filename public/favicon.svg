<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fridge Locker 3000 favicon: one true corn cob. -->
  <ellipse cx="32" cy="30" rx="13" ry="20" fill="#ffd23f" stroke="#000" stroke-width="3"/>
  <!-- kernels -->
  <path d="M32 14v32M24 18c2 8 2 18 0 26M40 18c-2 8-2 18 0 26M20 28c4 2 20 2 24 0M21 36c4 2 18 2 22 0"
        fill="none" stroke="#e8a000" stroke-width="2" stroke-linecap="round"/>
  <!-- husk leaves -->
  <path d="M21 12C12 24 12 44 24 56c-3-14-2-30 4-40z" fill="#2f9e44" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M43 12c9 12 9 32-3 44 3-14 2-30-4-40z" fill="#2f9e44" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <!-- a very cold snowflake, because refrigeration -->
  <path d="M52 8v10M47.5 10.5l9 5M56.5 10.5l-9 5" stroke="#00c2ff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
