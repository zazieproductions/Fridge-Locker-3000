name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, format, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate (typecheck + lint + format + tests + build)
        run: npm run validate

      - name: Assert no telemetry ships in the build
        run: |
          if grep -riE 'designarena|rrweb|arena:' dist/; then
            echo "::error::Platform telemetry found in production build"
            exit 1
          fi
          echo "Build is clean: no designarena / rrweb references."

      - name: Upload built site
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
